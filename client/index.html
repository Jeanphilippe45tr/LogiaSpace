    <script>
      // Initialize WOW.js, CounterUp, and Owl Carousel after React mounts
      (function () {
        function initLibs() {
          if (typeof WOW !== 'undefined') {
            new WOW().init();
          }
          if (typeof jQuery !== 'undefined' && typeof jQuery.fn.counterUp !== 'undefined') {
            jQuery('[data-toggle="counter-up"]').counterUp({ delay: 10, time: 2000 });
          }
          if (typeof jQuery !== 'undefined' && typeof jQuery.fn.owlCarousel !== 'undefined') {
            jQuery('.testimonial-carousel').owlCarousel({
              autoplay: true,
              smartSpeed: 1500,
              dots: true,
              loop: true,
              center: true,
              responsive: { 0: { items: 1 }, 576: { items: 1 }, 768: { items: 2 }, 992: { items: 3 } }
            });
            jQuery('.vendor-carousel').owlCarousel({
              margin: 45,
              dots: false,
              loop: true,
              autoplay: true,
              smartSpeed: 1000,
              responsive: { 0: { items: 2 }, 576: { items: 4 }, 768: { items: 6 }, 992: { items: 8 } }
            });
          }
          // Sticky navbar
          if (typeof jQuery !== 'undefined') {
            jQuery(window).scroll(function () {
              if (jQuery(this).scrollTop() > 45) {
                jQuery('.navbar').addClass('sticky-top shadow-sm');
              } else {
                jQuery('.navbar').removeClass('sticky-top shadow-sm');
              }
            });
            // Back to top
            jQuery(window).scroll(function () {
              if (jQuery(this).scrollTop() > 100) {
                jQuery('.back-to-top').fadeIn('slow');
              } else {
                jQuery('.back-to-top').fadeOut('slow');
              }
            });
            jQuery('.back-to-top').click(function () {
              jQuery('html, body').animate({ scrollTop: 0 }, 1500, 'easeInOutExpo');
              return false;
            });
          }
        }
        // Try immediately, then retry after React renders
        initLibs();
        setTimeout(initLibs, 500);
        setTimeout(initLibs, 1000);
      })();
